    <!-- Script to prevent Theme Flash -->
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (!savedTheme && prefersDark) || !savedTheme) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 dark:bg-[#070b14] dark:text-slate-100 transition-colors duration-300 selection:bg-primary-500 selection:text-white overflow-x-hidden antialiased">
